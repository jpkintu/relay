name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Cloud Code bundle is up to date
        run: |
          npm run build:cloud
          git diff --exit-code -- back4app || (echo "::error::back4app/cloud/main.js is stale. Run 'npm run build:cloud' and commit it." && exit 1)

  e2e:
    name: Cloud Code end-to-end (Parse Server + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          PARSE_TEST_DATABASE_URI: mongodb://localhost:27017/
          # Test the single-file bundle that is uploaded to Back4App.
          RELAY_CLOUD_MAIN: ../back4app/cloud/main.js
